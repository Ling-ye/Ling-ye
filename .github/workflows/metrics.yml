name: Metrics

on:
  schedule:
    - cron: "15 16 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  render:
    name: Render profile metrics
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: GitHub user statistics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          use_prebuilt_image: yes
          user: Ling-ye
          filename: metrics.base.svg
          base: header, activity, community, repositories
          config_timezone: Asia/Shanghai

      - name: Language statistics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          use_prebuilt_image: yes
          user: Ling-ye
          filename: metrics.languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_languages_other: yes

      - name: Isometric commit calendar
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          use_prebuilt_image: yes
          user: Ling-ye
          filename: metrics.isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

      - name: Featured repositories
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          use_prebuilt_image: yes
          user: Ling-ye
          filename: metrics.repositories.svg
          base: ""
          plugin_repositories: yes
          plugin_repositories_featured: Ling-ye/AgentStrata, Ling-ye/cc-port, Ling-ye/Lingye_Agent

      - name: Favorite AniList characters
        if: ${{ vars.ANILIST_USERNAME != '' }}
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: NOT_NEEDED
          use_prebuilt_image: yes
          filename: metrics.anilist.svg
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: ${{ vars.ANILIST_USERNAME }}
          plugin_anilist_medias: anime
          plugin_anilist_sections: characters
          plugin_anilist_limit_characters: 12
          plugin_anilist_shuffle: yes

      - name: Favorite music
        if: ${{ vars.MUSIC_PLAYLIST_URL != '' }}
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: NOT_NEEDED
          use_prebuilt_image: yes
          filename: metrics.music.svg
          base: ""
          plugin_music: yes
          plugin_music_provider: youtube
          plugin_music_mode: playlist
          plugin_music_playlist: ${{ vars.MUSIC_PLAYLIST_URL }}
          plugin_music_limit: 4

      - name: Check optional 16Personalities profile
        id: personalities
        env:
          PROFILE_URL: ${{ secrets.SIXTEEN_PERSONALITIES_URL }}
        run: |
          if [[ -n "$PROFILE_URL" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: INFJ personality profile
        if: ${{ steps.personalities.outputs.configured == 'true' }}
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6
        with:
          token: NOT_NEEDED
          use_prebuilt_image: yes
          filename: metrics.16personalities.svg
          base: ""
          plugin_16personalities: yes
          plugin_16personalities_url: ${{ secrets.SIXTEEN_PERSONALITIES_URL }}
          plugin_16personalities_sections: personality, profile, traits
          plugin_16personalities_scores: no
